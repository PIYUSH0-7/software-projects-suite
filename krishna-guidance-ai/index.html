
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krishna's Path | Divine Guidance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
    <style>
      :root {
        --divine-gold: #fbbf24;
        --divine-amber: #f59e0b;
        --divine-deep: #0f172a;
      }
      body {
        background-color: var(--divine-deep);
        color: #f8fafc;
        font-family: 'Lora', serif;
        overflow-x: hidden;
      }
      .font-divine {
        font-family: 'Cinzel', serif;
      }
      .font-sanskrit {
        font-family: 'Tiro Devanagari Sanskrit', serif;
      }
      .glass {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(251, 191, 36, 0.2);
      }
      .shloka-box {
        border-left: 3px solid var(--divine-gold);
        background: rgba(251, 191, 36, 0.05);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #020617;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--divine-gold);
        border-radius: 10px;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.8s ease-out forwards;
      }
    </style>
    <script type="importmap">

      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",

      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
